name: Go Build Check

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHubからコードをダウンロードしてくる
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. ロボットの中にGo言語の環境をセットアップする
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    # 3. 実際にビルド（コンパイル）できるかテストする！
    - name: Build
      run: go build -v ./...
